name: Forge simulation

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      FORGE_VERSION: "2.0.14"
      FORGE_SOURCE: "${{ github.workspace }}/forge-2.0.14-source"
      DISPLAY: ":99"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb xauth

          echo "Checking Xvfb installation..."
          command -v Xvfb
          Xvfb -help >/dev/null 2>&1 || true

      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail

          Xvfb "$DISPLAY" \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!
          echo "$XVFB_PID" > /tmp/xvfb.pid

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat /tmp/xvfb.log || true
            exit 1
          fi

          echo "Xvfb started successfully on $DISPLAY"

      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          test -f engine/forge/build_patched_2_0_14.sh
          chmod +x engine/forge/build_patched_2_0_14.sh

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$FORGE_SOURCE"

          git clone \
            --depth 1 \
            --branch "forge-${FORGE_VERSION}" \
            https://github.com/Card-Forge/forge.git \
            "$FORGE_SOURCE"

          cd "$FORGE_SOURCE"

          git rev-parse --short HEAD

      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$FORGE_SOURCE/.mvn"

          if [ -f "$HOME/.m2/settings.xml" ]; then
            cp "$HOME/.m2/settings.xml" \
              "$FORGE_SOURCE/.mvn/local-settings.xml"
          else
            cat > "$FORGE_SOURCE/.mvn/local-settings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          fi

          test -f "$FORGE_SOURCE/.mvn/local-settings.xml"

      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "DISPLAY=$DISPLAY"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          mvn -version

          ./engine/forge/build_patched_2_0_14.sh "$FORGE_SOURCE"

      - name: Locate Forge runtime
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge runtime..."

          find "$FORGE_SOURCE" \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "forge" \
              -o -name "forge.sh" \
            \) \
            -print \
            | head -100

      - name: Run Forge regression tests
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FORGE_SOURCE"

          if [ -f ".mvn/local-settings.xml" ]; then
            SETTINGS_ARG="-s .mvn/local-settings.xml"
          else
            SETTINGS_ARG=""
          fi

          mvn \
            $SETTINGS_ARG \
            -Djava.awt.headless=false \
            -DskipTests=false \
            test

      - name: Run Izzet Spellmentals experiment
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Running Izzet Spellmentals experiment..."

          if [ -f scripts/izzet_spellmentals.py ]; then
            python scripts/izzet_spellmentals.py
          elif [ -f engine/izzet_spellmentals.py ]; then
            python engine/izzet_spellmentals.py
          else
            echo "No Izzet Spellmentals experiment script found."
            echo "Skipping experiment."
          fi

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Simulation results"
          echo "========================================"

          if [ -d results ]; then
            find results -maxdepth 3 -type f -print
          fi

          if [ -d output ]; then
            find output -maxdepth 3 -type f -print
          fi

          if [ -d "$FORGE_SOURCE" ]; then
            find "$FORGE_SOURCE" \
              -type f \
              \( \
                -name "*.log" \
                -o -name "*.txt" \
                -o -name "*.json" \
              \) \
              -print \
              | head -100
          fi

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            results/
            output/
            /tmp/xvfb.log
            ${{ env.FORGE_SOURCE }}/**/target/surefire-reports/
            ${{ env.FORGE_SOURCE }}/**/target/*.log
          if-no-files-found: ignore

      - name: Stop Xvfb
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi
