name: Forge simulation

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ============================================================
      # FIND ANY Xvfb VERSION CALL
      #
      # This runs BEFORE Xvfb is installed.
      #
      # If --version exists anywhere in our repository, this will
      # tell us exactly which file contains it.
      # ============================================================

      - name: Find every Xvfb version call
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SEARCHING REPOSITORY FOR Xvfb"
          echo "=========================================="

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=target \
            --exclude-dir=.m2 \
            'Xvfb|xvfb' \
            . || true

          echo "=========================================="
          echo "SEARCHING SPECIFICALLY FOR Xvfb --version"
          echo "=========================================="

          grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=target \
            --exclude-dir=.m2 \
            'Xvfb[[:space:]]+(-{1,2})version|xvfb[[:space:]]+(-{1,2})version' \
            . || true

          echo "=========================================="
          echo "SEARCH COMPLETE"
          echo "=========================================="


      # ============================================================
      # INSTALL XVFB
      #
      # IMPORTANT:
      #
      # We DO NOT run:
      #
      #   Xvfb --version
      #   Xvfb -version
      #
      # because this Xvfb build rejects those arguments.
      # ============================================================

      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xauth

          echo "=========================================="
          echo "Xvfb executable"
          echo "=========================================="

          command -v Xvfb

          type -a Xvfb

          ls -l "$(command -v Xvfb)"

          readlink -f "$(command -v Xvfb)"

          echo "=========================================="
          echo "Xvfb package"
          echo "=========================================="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            xvfb

          echo "=========================================="
          echo "Starting Xvfb"
          echo "=========================================="

          rm -f /tmp/xvfb.pid
          rm -f /tmp/xvfb.log
          rm -f /tmp/.X11-unix/X99

          Xvfb :99 \
            -screen 0 1280x1024x24 \
            -ac \
            -nolisten tcp \
            > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" > /tmp/xvfb.pid

          echo "Xvfb PID: $XVFB_PID"

          echo "=========================================="
          echo "Waiting for Xvfb"
          echo "=========================================="

          for i in {1..30}; do

            if kill -0 "$XVFB_PID" 2>/dev/null \
              && [ -S /tmp/.X11-unix/X99 ]; then

              echo "Xvfb is ready."

              break
            fi

            echo "Waiting for Xvfb... $i/30"

            sleep 1

          done

          echo "=========================================="
          echo "Xvfb process"
          echo "=========================================="

          ps -fp "$XVFB_PID" || true

          ps aux | grep '[X]vfb' || true

          echo "=========================================="
          echo "Xvfb log"
          echo "=========================================="

          cat /tmp/xvfb.log || true

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then

            echo "ERROR: Xvfb terminated."

            cat /tmp/xvfb.log || true

            exit 1

          fi

          if [ ! -S /tmp/.X11-unix/X99 ]; then

            echo "ERROR: X11 socket was not created."

            cat /tmp/xvfb.log || true

            exit 1

          fi

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          export DISPLAY=:99

          echo "DISPLAY=$DISPLAY"


      # ============================================================
      # VERIFY DISPLAY
      # ============================================================

      - name: Verify graphical environment
        shell: bash
        env:
          DISPLAY: ":99"
        run: |
          set -euxo pipefail

          echo "DISPLAY=$DISPLAY"

          test -S /tmp/.X11-unix/X99

          echo "=========================================="
          echo "Testing X display"
          echo "=========================================="

          xdpyinfo

          echo "=========================================="
          echo "Virtual X display is working"
          echo "=========================================="


      # ============================================================
      # CHECK BUILD SCRIPT
      # ============================================================

      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          test -f engine/forge/build_patched_2_0_14.sh

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "=========================================="
          echo "BUILD SCRIPT"
          echo "=========================================="

          sed -n '1,400p' \
            engine/forge/build_patched_2_0_14.sh


      # ============================================================
      # SEARCH BUILD SCRIPT FOR XVFB / VERSION
      # ============================================================

      - name: Inspect build script for Xvfb calls
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Xvfb references in build script"
          echo "=========================================="

          grep -niE \
            'Xvfb|xvfb' \
            engine/forge/build_patched_2_0_14.sh \
            || true

          echo "=========================================="
          echo "Version calls in build script"
          echo "=========================================="

          grep -niE \
            'Xvfb[[:space:]]+(-{1,2})version|xvfb[[:space:]]+(-{1,2})version' \
            engine/forge/build_patched_2_0_14.sh \
            || true


      # ============================================================
      # DOWNLOAD FORGE
      # ============================================================

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf forge-2.0.14-source

          git clone \
            --depth 1 \
            --branch forge-2.0.14 \
            https://github.com/Card-Forge/forge.git \
            forge-2.0.14-source

          cd forge-2.0.14-source

          echo "=========================================="
          echo "FORGE COMMIT"
          echo "=========================================="

          git rev-parse HEAD

          echo "=========================================="
          echo "FORGE BRANCH"
          echo "=========================================="

          git branch --show-current


      # ============================================================
      # MAVEN SETTINGS
      # ============================================================

      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.m2"

          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <interactiveMode>false</interactiveMode>

          </settings>
          EOF

          echo "Maven settings created."


      # ============================================================
      # BUILD PATCHED FORGE
      # ============================================================

      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          MAVEN_OPTS: "-Djava.awt.headless=false"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDING PATCHED FORGE"
          echo "=========================================="

          echo "DISPLAY=$DISPLAY"

          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"

          echo "MAVEN_OPTS=$MAVEN_OPTS"

          chmod +x \
            engine/forge/build_patched_2_0_14.sh

          ./engine/forge/build_patched_2_0_14.sh \
            "$GITHUB_WORKSPACE/forge-2.0.14-source"


      # ============================================================
      # LOCATE FORGE ARTIFACTS
      # ============================================================

      - name: Locate Forge runtime
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "FORGE JARS"
          echo "=========================================="

          find forge-2.0.14-source \
            -type f \
            -name "*.jar" \
            -print \
            | head -300

          echo "=========================================="
          echo "FORGE ZIP FILES"
          echo "=========================================="

          find forge-2.0.14-source \
            -type f \
            -name "*.zip" \
            -print \
            | head -300


      # ============================================================
      # REGRESSION TESTS
      # ============================================================

      - name: Run Forge regression tests
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          MAVEN_OPTS: "-Djava.awt.headless=false"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail

          cd forge-2.0.14-source

          echo "DISPLAY=$DISPLAY"

          java \
            -Djava.awt.headless=false \
            -version

          if [ -x ./mvnw ]; then

            ./mvnw -ntp test

          else

            mvn -ntp test

          fi


      # ============================================================
      # IZZET SPELLEMENTALS EXPERIMENT
      # ============================================================

      - name: Run Izzet Spellementals experiment
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          MAVEN_OPTS: "-Djava.awt.headless=false"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail

          if [ -f scripts/izzet_spellementals.sh ]; then

            chmod +x \
              scripts/izzet_spellementals.sh

            ./scripts/izzet_spellementals.sh

          else

            echo "Izzet Spellementals experiment script not present."

            echo "Skipping experiment."

          fi


      # ============================================================
      # COLLECT RESULTS
      # ============================================================

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "FORGE BUILD / TEST ARTIFACTS"
          echo "=========================================="

          find forge-2.0.14-source \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.txt" \
              -o -name "*.json" \
              -o -name "*.xml" \
              -o -name "*.dump" \
              -o -name "*.dumpstream" \
            \) \
            -print \
            | head -500

          echo "=========================================="
          echo "SUREFIRE REPORTS"
          echo "=========================================="

          find forge-2.0.14-source \
            -path "*/target/surefire-reports/*" \
            -type f \
            -print \
            | head -500

          echo "=========================================="
          echo "XVFB LOG"
          echo "=========================================="

          cat /tmp/xvfb.log 2>/dev/null || true


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            forge-2.0.14-source/**/target/surefire-reports/**
            forge-2.0.14-source/**/target/*.log
            forge-2.0.14-source/**/target/*.dump
            forge-2.0.14-source/**/target/*.dumpstream
            /tmp/xvfb.log
          if-no-files-found: ignore


      # ============================================================
      # STOP XVFB
      # ============================================================

      - name: Stop Xvfb
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/xvfb.pid ]; then

            XVFB_PID="$(cat /tmp/xvfb.pid)"

            echo "Stopping Xvfb PID $XVFB_PID"

            kill "$XVFB_PID" 2>/dev/null || true

            sleep 1

            kill -9 "$XVFB_PID" 2>/dev/null || true

            rm -f /tmp/xvfb.pid

          fi

          rm -f /tmp/.X11-unix/X99
