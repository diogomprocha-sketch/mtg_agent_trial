name: Forge simulation

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Number of games to run"
        required: false
        default: "20"
      seed:
        description: "Base random seed"
        required: false
        default: "2026082501"

permissions:
  contents: read

jobs:
  simulate:
    name: Forge simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORGE_VERSION: "2.0.14"
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
      GAMES: ${{ inputs.games || '20' }}
      BASE_SEED: ${{ inputs.seed || '2026082501' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # Install virtual X display
      # ------------------------------------------------------------
      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb

          # Do NOT use "Xvfb -version".
          # Some Ubuntu Xvfb builds do not support that option.
          command -v Xvfb
          Xvfb -help >/dev/null 2>&1 || true

      # ------------------------------------------------------------
      # Verify Xvfb actually works
      # ------------------------------------------------------------
      - name: Test virtual display
        shell: bash
        run: |
          set -euxo pipefail

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            bash -c 'echo "Virtual DISPLAY is: $DISPLAY"'

      # ------------------------------------------------------------
      # Inspect repository
      # ------------------------------------------------------------
      - name: Inspect repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -300

          echo
          echo "Forge build scripts:"
          find engine -maxdepth 4 -type f -print 2>/dev/null || true

          echo
          echo "Workflow files:"
          find .github -maxdepth 3 -type f -print 2>/dev/null || true

      # ------------------------------------------------------------
      # Validate build script
      # ------------------------------------------------------------
      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          test -f engine/forge/build_patched_2_0_14.sh

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "Build script:"
          ls -lh engine/forge/build_patched_2_0_14.sh

      # ------------------------------------------------------------
      # Download Forge 2.0.14
      # ------------------------------------------------------------
      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf forge-2.0.14-source

          git clone \
            --depth 1 \
            --branch forge-2.0.14 \
            https://github.com/Card-Forge/forge.git \
            forge-2.0.14-source

          cd forge-2.0.14-source

          echo "Forge revision:"
          git rev-parse HEAD

          echo
          echo "Forge tags:"
          git tag --points-at HEAD || true

      # ------------------------------------------------------------
      # Maven local settings
      # ------------------------------------------------------------
      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p forge-2.0.14-source/.mvn

          cat > forge-2.0.14-source/.mvn/local-settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <interactiveMode>false</interactiveMode>
          </settings>
          EOF

          test -f forge-2.0.14-source/.mvn/local-settings.xml

      # ------------------------------------------------------------
      # Build patched Forge
      #
      # Xvfb supplies the DISPLAY required by GuiDesktop.
      # ------------------------------------------------------------
      - name: Build patched Forge 2.0.14
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            ./engine/forge/build_patched_2_0_14.sh \
              "$GITHUB_WORKSPACE/forge-2.0.14-source"

      # ------------------------------------------------------------
      # Locate Forge runtime
      # ------------------------------------------------------------
      - name: Locate Forge runtime
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge runtime..."

          find forge-2.0.14-source \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "forge*.jar" \
            \) \
            -print | sort | head -200

      # ------------------------------------------------------------
      # Run Forge tests under virtual display
      # ------------------------------------------------------------
      - name: Run Forge regression tests
        shell: bash
        run: |
          set -euxo pipefail

          cd forge-2.0.14-source

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            mvn -B \
              -Djava.awt.headless=false \
              -DskipTests=false \
              test

      # ------------------------------------------------------------
      # Specifically inspect We Say Thee Nay
      # ------------------------------------------------------------
      - name: Verify We Say Thee Nay test
        shell: bash
        run: |
          set -euxo pipefail

          cd forge-2.0.14-source

          echo "========================================"
          echo "Searching for We Say Thee Nay"
          echo "========================================"

          find . -type f \
            \( \
              -name "*WeSayTheeNay*" \
              -o -name "*We_Say_Thee_Nay*" \
            \) \
            -print

          echo
          echo "========================================"
          echo "Surefire reports"
          echo "========================================"

          find . \
            -path "*/target/surefire-reports/*" \
            -type f \
            -print | sort

      # ------------------------------------------------------------
      # Run simulation
      # ------------------------------------------------------------
      - name: Run Izzet Spellementals experiment
        shell: bash
        run: |
          set -euxo pipefail

          echo "Games: $GAMES"
          echo "Base seed: $BASE_SEED"

          if [ -f scripts/run_experiment.py ]; then

            python scripts/run_experiment.py \
              --games "$GAMES" \
              --seed "$BASE_SEED"

          elif [ -f engine/simulation/run_experiment.py ]; then

            python engine/simulation/run_experiment.py \
              --games "$GAMES" \
              --seed "$BASE_SEED"

          elif [ -f simulation/run_experiment.py ]; then

            python simulation/run_experiment.py \
              --games "$GAMES" \
              --seed "$BASE_SEED"

          else

            echo "ERROR: No experiment runner found."

            echo
            echo "Python files in repository:"
            find . -type f -name "*.py" | sort

            exit 1

          fi

      # ------------------------------------------------------------
      # Display results
      # ------------------------------------------------------------
      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Simulation result files"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.json" \
              -o -name "*.jsonl" \
              -o -name "*.csv" \
              -o -name "*.md" \
              -o -name "*.log" \
            \) \
            -not -path "./.git/*" \
            -print | sort

          echo
          echo "========================================"
          echo "Recent result files"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.json" \
              -o -name "*.jsonl" \
              -o -name "*.csv" \
              -o -name "*.log" \
            \) \
            -not -path "./.git/*" \
            -print \
            -exec sh -c 'echo "----- $1 -----"; tail -100 "$1"' _ {} \;

      # ------------------------------------------------------------
      # Upload diagnostics/results even if experiment fails
      # ------------------------------------------------------------
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            forge-2.0.14-source/**/target/surefire-reports/**
            forge-2.0.14-source/**/target/*.log
            forge-2.0.14-source/**/target/*.txt
            results/**
            output/**
            artifacts/**
            logs/**
            reports/**
          if-no-files-found: warn
          retention-days: 14
