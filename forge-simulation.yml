name: Forge simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      FORGE_VERSION: "2.0.14"
      DISPLAY: ":99"
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          else
            echo "No requirements.txt found; continuing."
          fi

      # ------------------------------------------------------------
      # Xvfb
      #
      # IMPORTANT:
      # Do NOT use "Xvfb -version".
      # That is the command which previously caused:
      #   Fatal server error:
      #   (EE) Unrecognized option: -version
      # ------------------------------------------------------------
      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb

          echo "Checking Xvfb installation..."

          command -v Xvfb

          echo "Xvfb binary:"
          ls -l "$(command -v Xvfb)"

          echo "Xvfb help:"
          Xvfb -help >/tmp/xvfb-help.txt 2>&1 || true
          head -n 20 /tmp/xvfb-help.txt

          echo "Xvfb installation OK."

      # ------------------------------------------------------------
      # Virtual display
      # ------------------------------------------------------------
      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail

          Xvfb :99 \
            -screen 0 1280x1024x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" >/tmp/xvfb.pid

          echo "Waiting for Xvfb..."

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "ERROR: Xvfb failed to start."
            echo
            echo "=== Xvfb log ==="
            cat /tmp/xvfb.log || true
            exit 1
          fi

          echo "Xvfb started successfully."
          echo "PID: $XVFB_PID"
          echo "DISPLAY: $DISPLAY"

      # ------------------------------------------------------------
      # Repository inspection
      # ------------------------------------------------------------
      - name: Inspect repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "Working directory:"
          pwd

          echo
          echo "Git status:"
          git status --short --branch

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -n 250

          echo
          echo "Workflow files:"
          find .github/workflows -maxdepth 1 -type f -print 2>/dev/null || true

      # ------------------------------------------------------------
      # Check Forge build script
      # ------------------------------------------------------------
      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f engine/forge/build_patched_2_0_14.sh ]; then
            echo "ERROR: Forge build script not found:"
            echo "engine/forge/build_patched_2_0_14.sh"
            exit 1
          fi

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "Forge build script:"
          ls -l engine/forge/build_patched_2_0_14.sh

          echo
          echo "First 260 lines:"
          sed -n '1,260p' engine/forge/build_patched_2_0_14.sh

      # ------------------------------------------------------------
      # Download Forge 2.0.14
      # ------------------------------------------------------------
      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "$GITHUB_WORKSPACE/forge-2.0.14-source" ]; then
            echo "Forge source already exists."
            exit 0
          fi

          WORK_DIR="$GITHUB_WORKSPACE/forge-download"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          cd "$WORK_DIR"

          echo "Downloading Forge ${FORGE_VERSION}..."

          if git ls-remote \
              --exit-code \
              --tags \
              https://github.com/Card-Forge/forge.git \
              "refs/tags/forge-${FORGE_VERSION}" \
              >/dev/null 2>&1; then

            echo "Forge tag found. Cloning tag."

            git clone \
              --depth 1 \
              --branch "forge-${FORGE_VERSION}" \
              https://github.com/Card-Forge/forge.git \
              forge-source

          else

            echo "Forge tag was not found."
            echo "Downloading the GitHub source archive instead."

            curl \
              --fail \
              --show-error \
              --location \
              --retry 3 \
              --output forge-source.tar.gz \
              "https://github.com/Card-Forge/forge/archive/refs/tags/forge-${FORGE_VERSION}.tar.gz"

            tar -xzf forge-source.tar.gz

            SOURCE_DIR="$(find . -maxdepth 1 -type d -name 'forge-*' | head -n 1)"

            if [ -z "$SOURCE_DIR" ]; then
              echo "ERROR: Could not find extracted Forge source."
              exit 1
            fi

            mv "$SOURCE_DIR" forge-source

          fi

          cd "$GITHUB_WORKSPACE"

          mv "$WORK_DIR/forge-source" \
             "$GITHUB_WORKSPACE/forge-2.0.14-source"

          rm -rf "$WORK_DIR"

          echo
          echo "Forge source successfully prepared."

          ls -la "$GITHUB_WORKSPACE/forge-2.0.14-source"

      # ------------------------------------------------------------
      # Maven settings
      # ------------------------------------------------------------
      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.m2"

          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <profiles>
              <profile>
                <id>github</id>
                <properties>
                  <gpg.skip>true</gpg.skip>
                </properties>
              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>

          </settings>
          EOF

          test -f "$HOME/.m2/settings.xml"

          echo "Maven settings created."

      # ------------------------------------------------------------
      # Build patched Forge
      # ------------------------------------------------------------
      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "DISPLAY=$DISPLAY"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"

          ./engine/forge/build_patched_2_0_14.sh \
            "$GITHUB_WORKSPACE/forge-2.0.14-source"

      # ------------------------------------------------------------
      # Locate Forge runtime
      # ------------------------------------------------------------
      - name: Locate Forge runtime
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge runtime..."

          find "$GITHUB_WORKSPACE/forge-2.0.14-source" \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "forge" \
              -o -name "forge.jar" \
            \) \
            | sort \
            | head -n 300

      # ------------------------------------------------------------
      # Forge regression test
      # ------------------------------------------------------------
      - name: Run Forge regression tests
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/forge-2.0.14-source"

          echo "DISPLAY=$DISPLAY"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"

          mvn \
            -Djava.awt.headless=false \
            -Dtest=WeSayTheeNayTest \
            test

      # ------------------------------------------------------------
      # Locate experiment runner
      # ------------------------------------------------------------
      - name: Locate experiment runner
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for simulation runners..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.py" \
              -o -name "*.sh" \
              -o -name "*.jar" \
            \) \
            | grep -Ei \
              'simulat|experiment|izzet|trajectory|replay|runner' \
            | sort \
            | head -n 300 || true

      # ------------------------------------------------------------
      # Run experiment
      # ------------------------------------------------------------
      - name: Run Izzet Spellementals experiment
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          echo "Starting Izzet Spellementals experiment..."

          if [ -f scripts/run_izzet_experiment.py ]; then

            python scripts/run_izzet_experiment.py

          elif [ -f scripts/simulate.py ]; then

            python scripts/simulate.py

          elif [ -f simulation/run_simulation.py ]; then

            python simulation/run_simulation.py

          else

            echo "ERROR: No known experiment runner was found."
            echo
            echo "Python files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.py" \
              | sort \
              | head -n 300

            exit 1

          fi

      # ------------------------------------------------------------
      # Always display result files
      # ------------------------------------------------------------
      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Simulation result files"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.json" \
              -o -name "*.jsonl" \
              -o -name "*.csv" \
              -o -name "*.txt" \
              -o -name "*.log" \
              -o -name "*.md" \
            \) \
            | grep -Ei \
              'result|simulation|trajectory|replay|experiment|summary|report' \
            | sort \
            | head -n 500 || true

      # ------------------------------------------------------------
      # Upload results
      # ------------------------------------------------------------
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            results/**
            output/**
            artifacts/**
            simulation/**
            trajectories/**
            replays/**
            reports/**
            forge-2.0.14-source/**/target/surefire-reports/**
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Xvfb diagnostics
      # ------------------------------------------------------------
      - name: Show Xvfb diagnostics
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Xvfb diagnostics"
          echo "=========================================="

          echo "DISPLAY=$DISPLAY"

          if [ -f /tmp/xvfb.pid ]; then
            echo "Xvfb PID:"
            cat /tmp/xvfb.pid

            PID="$(cat /tmp/xvfb.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Xvfb process is still running."
            else
              echo "Xvfb process is no longer running."
            fi
          fi

          echo
          echo "Xvfb log:"
          if [ -f /tmp/xvfb.log ]; then
            cat /tmp/xvfb.log
          else
            echo "No Xvfb log found."
          fi
