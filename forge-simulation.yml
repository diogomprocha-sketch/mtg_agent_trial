name: Forge simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      FORGE_VERSION: "2.0.14"
      DISPLAY: ":99"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb

          echo "Checking Xvfb installation..."
          command -v Xvfb
          Xvfb -help >/tmp/xvfb-help.txt 2>&1 || true
          head -n 5 /tmp/xvfb-help.txt

      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail

          Xvfb "$DISPLAY" \
            -screen 0 1280x1024x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            >/tmp/xvfb.log 2>&1 &

          XVFB_PID=$!
          echo "$XVFB_PID" > /tmp/xvfb.pid

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start"
            cat /tmp/xvfb.log
            exit 1
          fi

          echo "Xvfb running with PID $XVFB_PID"
          echo "DISPLAY=$DISPLAY"

      - name: Inspect repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -n 200

          echo
          echo "Forge build script:"
          if [ -f engine/forge/build_patched_2_0_14.sh ]; then
            ls -l engine/forge/build_patched_2_0_14.sh
          else
            echo "ERROR: engine/forge/build_patched_2_0_14.sh not found"
            exit 1
          fi

      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          sed -n '1,240p' engine/forge/build_patched_2_0_14.sh

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "forge-2.0.14-source" ]; then
            echo "Forge source already exists."
            exit 0
          fi

          mkdir -p forge-download
          cd forge-download

          echo "Downloading Forge ${FORGE_VERSION} source..."

          git clone \
            --depth 1 \
            --branch "forge-${FORGE_VERSION}" \
            https://github.com/Card-Forge/forge.git \
            forge-source || {

              echo "Tagged clone failed; downloading the release source instead."

              cd ..
              rm -rf forge-download
              mkdir -p forge-download

              curl -L \
                --fail \
                --retry 3 \
                -o forge-source.tar.gz \
                "https://github.com/Card-Forge/forge/archive/refs/tags/forge-${FORGE_VERSION}.tar.gz"

              tar -xzf forge-source.tar.gz \
                -C forge-download

              EXTRACTED_DIR=$(find forge-download -maxdepth 1 -type d -name 'forge-*' | head -n 1)

              if [ -z "$EXTRACTED_DIR" ]; then
                echo "ERROR: Could not locate extracted Forge source."
                exit 1
              fi

              mv "$EXTRACTED_DIR" forge-download/forge-source
            }

          cd ..

          mv forge-download/forge-source forge-2.0.14-source
          rm -rf forge-download

          echo "Forge source:"
          ls -la forge-2.0.14-source

      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.m2"

          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>github</id>
                <properties>
                  <gpg.skip>true</gpg.skip>
                </properties>
              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
          </settings>
          EOF

          test -f "$HOME/.m2/settings.xml"

      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          ./engine/forge/build_patched_2_0_14.sh \
            "$GITHUB_WORKSPACE/forge-2.0.14-source"

      - name: Locate Forge runtime
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge runtime..."

          find forge-2.0.14-source \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "forge" \
              -o -name "forge.jar" \
            \) \
            | sort \
            | head -n 200

      - name: Run Forge regression tests
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          cd forge-2.0.14-source

          echo "DISPLAY=$DISPLAY"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"

          mvn \
            -Djava.awt.headless=false \
            -Dtest=WeSayTheeNayTest \
            test

      - name: Run Izzet Spellementals experiment
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          echo "Starting Izzet Spellementals experiment..."

          if [ -f scripts/run_izzet_experiment.py ]; then
            python scripts/run_izzet_experiment.py
          elif [ -f scripts/simulate.py ]; then
            python scripts/simulate.py
          elif [ -f simulation/run_simulation.py ]; then
            python simulation/run_simulation.py
          else
            echo "No experiment runner found."
            echo
            echo "Repository Python files:"
            find . -type f -name "*.py" | sort | head -n 300
            exit 1
          fi

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          echo "=== Simulation result files ==="

          find . \
            -type f \
            \( \
              -name "*.json" \
              -o -name "*.jsonl" \
              -o -name "*.csv" \
              -o -name "*.txt" \
              -o -name "*.log" \
              -o -name "*.md" \
            \) \
            | grep -Ei \
              'result|simulation|trajectory|replay|experiment|summary|report' \
            | sort \
            | head -n 300 || true

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            results/**
            output/**
            artifacts/**
            simulation/**
            trajectories/**
            replays/**
            reports/**
          if-no-files-found: warn

      - name: Show Xvfb log
        if: always()
        shell: bash
        run: |
          echo "=== Xvfb log ==="
          if [ -f /tmp/xvfb.log ]; then
            cat /tmp/xvfb.log
          else
            echo "No Xvfb log found."
          fi
