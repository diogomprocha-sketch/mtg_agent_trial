name: Forge simulation

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb

          # Do NOT use "Xvfb -version" or "Xvfb --version".
          # Some Xvfb builds reject those arguments.

          command -v Xvfb
          dpkg-query -W -f='${Status}\n' xvfb

          # Start a virtual X display for Forge's GUI code.
          Xvfb :99 -screen 0 1280x1024x24 -ac -nolisten tcp > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!
          echo "$XVFB_PID" > /tmp/xvfb.pid

          # Give Xvfb a moment to initialize.
          for i in {1..20}; do
            if [ -S /tmp/.X11-unix/X99 ]; then
              break
            fi
            sleep 0.5
          done

          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "Xvfb failed to start."
            cat /tmp/xvfb.log || true
            exit 1
          fi

          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          export DISPLAY=:99

          echo "Xvfb started successfully on DISPLAY=$DISPLAY"

      - name: Verify graphical environment
        shell: bash
        run: |
          set -euxo pipefail

          test -S /tmp/.X11-unix/X99
          echo "DISPLAY=$DISPLAY"

          xdpyinfo >/dev/null 2>&1 || {
            echo "X display is not responding."
            cat /tmp/xvfb.log || true
            exit 1
          }

          echo "Virtual X display is working."

      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          test -f engine/forge/build_patched_2_0_14.sh
          chmod +x engine/forge/build_patched_2_0_14.sh

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf forge-2.0.14-source

          git clone --depth 1 \
            --branch forge-2.0.14 \
            https://github.com/Card-Forge/forge.git \
            forge-2.0.14-source

      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.m2"

          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <interactiveMode>false</interactiveMode>
          </settings>
          EOF

      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          ./engine/forge/build_patched_2_0_14.sh \
            "$GITHUB_WORKSPACE/forge-2.0.14-source"

      - name: Locate Forge runtime
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          find forge-2.0.14-source \
            -type f \
            \( -name "*.jar" -o -name "*.zip" \) \
            -print \
            | head -200

      - name: Run Forge regression tests
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          cd forge-2.0.14-source

          if [ -x ./mvnw ]; then
            ./mvnw -ntp test
          else
            mvn -ntp test
          fi

      - name: Run Izzet Spellementals experiment
        if: success()
        shell: bash
        env:
          DISPLAY: ":99"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail

          if [ -f scripts/izzet_spellementals.sh ]; then
            chmod +x scripts/izzet_spellementals.sh
            ./scripts/izzet_spellementals.sh
          else
            echo "Izzet Spellementals experiment script not present; skipping."
          fi

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Forge build/test artifacts ====="

          find forge-2.0.14-source \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.txt" \
              -o -name "*.json" \
              -o -name "*.xml" \
            \) \
            -print \
            | head -200

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            forge-2.0.14-source/**/target/surefire-reports/**
            forge-2.0.14-source/**/target/*.log
            /tmp/xvfb.log
          if-no-files-found: ignore

      - name: Stop Xvfb
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi
