name: Forge simulation

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  simulate:
    runs-on: ubuntu-24.04

    env:
      FORGE_VERSION: "2.0.14"
      FORGE_SOURCE: "${{ github.workspace }}/forge-2.0.14-source"

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ---------------------------------------------------------
      # PYTHON
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi


      # ---------------------------------------------------------
      # XVFB
      #
      # IMPORTANT:
      # Do NOT run Xvfb --version.
      # Do NOT run Xvfb -version.
      # Do NOT start Xvfb manually.
      #
      # xvfb-run handles the virtual display for us.
      # ---------------------------------------------------------

      - name: Install Xvfb
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb xauth

          test -x /usr/bin/Xvfb
          test -x /usr/bin/xvfb-run


      # ---------------------------------------------------------
      # INSPECT REPOSITORY
      # ---------------------------------------------------------

      - name: Inspect repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Forge directory:"
          ls -la engine/forge/

          echo ""
          echo "Checking Forge build script..."

          test -f engine/forge/build_patched_2_0_14.sh

          chmod +x engine/forge/build_patched_2_0_14.sh


      # ---------------------------------------------------------
      # DOWNLOAD FORGE
      # ---------------------------------------------------------

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$FORGE_SOURCE"

          git clone \
            --depth 1 \
            --branch "forge-${FORGE_VERSION}" \
            https://github.com/Card-Forge/forge.git \
            "$FORGE_SOURCE"

          cd "$FORGE_SOURCE"

          echo ""
          echo "Forge source:"
          pwd

          echo ""
          echo "Forge commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Checking Maven project..."

          test -f pom.xml


      # ---------------------------------------------------------
      # MAVEN SETTINGS
      # ---------------------------------------------------------

      - name: Create Maven local settings
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$FORGE_SOURCE/.mvn"

          cat > "$FORGE_SOURCE/.mvn/local-settings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <profiles>
              <profile>
                <id>github</id>

                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>

                    <releases>
                      <enabled>true</enabled>
                    </releases>

                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>

              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>

          </settings>
          EOF

          test -f "$FORGE_SOURCE/.mvn/local-settings.xml"


      # ---------------------------------------------------------
      # BUILD FORGE
      #
      # The ENTIRE Forge build is executed inside xvfb-run.
      # This gives Java/AWT the DISPLAY it requires.
      # ---------------------------------------------------------

      - name: Build patched Forge 2.0.14
        shell: bash
        env:
          DISPLAY: ""
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "Java:"
          java -version

          echo ""
          echo "Maven:"
          mvn -version

          echo ""
          echo "Forge source:"
          echo "$FORGE_SOURCE"

          echo ""
          echo "Starting Forge build with virtual X display..."

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -ac -nolisten tcp" \
            ./engine/forge/build_patched_2_0_14.sh \
              "$FORGE_SOURCE"


      # ---------------------------------------------------------
      # LOCATE RUNTIME
      # ---------------------------------------------------------

      - name: Locate Forge runtime
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge runtime..."

          find "$FORGE_SOURCE" \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "forge" \
              -o -name "forge.sh" \
            \) \
            -print \
            | head -200


      # ---------------------------------------------------------
      # REGRESSION TESTS
      # ---------------------------------------------------------

      - name: Run Forge regression tests
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FORGE_SOURCE"

          echo "Running Forge regression tests inside virtual X display..."

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -ac -nolisten tcp" \
            mvn \
              -s .mvn/local-settings.xml \
              -Djava.awt.headless=false \
              test


      # ---------------------------------------------------------
      # IZZET SPELLMENTALS
      # ---------------------------------------------------------

      - name: Run Izzet Spellmentals experiment
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "Looking for Izzet Spellmentals experiment..."

          if [ -f scripts/izzet_spellmentals.py ]; then

            python scripts/izzet_spellmentals.py

          elif [ -f engine/izzet_spellmentals.py ]; then

            python engine/izzet_spellmentals.py

          elif [ -f scripts/izzet_spellmentals.sh ]; then

            chmod +x scripts/izzet_spellmentals.sh
            scripts/izzet_spellmentals.sh

          elif [ -f engine/izzet_spellmentals.sh ]; then

            chmod +x engine/izzet_spellmentals.sh
            engine/izzet_spellmentals.sh

          else

            echo "No Izzet Spellmentals experiment script found."
            echo "Skipping experiment."

          fi


      # ---------------------------------------------------------
      # RESULTS
      # ---------------------------------------------------------

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "SIMULATION RESULTS"
          echo "========================================"

          if [ -d results ]; then
            echo ""
            echo "results/:"
            find results -maxdepth 5 -type f -print
          fi

          if [ -d output ]; then
            echo ""
            echo "output/:"
            find output -maxdepth 5 -type f -print
          fi

          if [ -d "$FORGE_SOURCE" ]; then
            echo ""
            echo "Surefire reports:"

            find "$FORGE_SOURCE" \
              -type f \
              -path "*/target/surefire-reports/*" \
              -print
          fi


      # ---------------------------------------------------------
      # ARTIFACTS
      # ---------------------------------------------------------

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-simulation-results
          path: |
            results/
            output/
            ${{ env.FORGE_SOURCE }}/**/target/surefire-reports/
            ${{ env.FORGE_SOURCE }}/**/target/*.log
          if-no-files-found: ignore
