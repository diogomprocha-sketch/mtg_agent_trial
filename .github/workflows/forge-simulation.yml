name: Forge simulation

on:
  workflow_dispatch:
    inputs:
      games_per_stage:
        description: "Games per stage (pre-board and post-board)"
        required: true
        default: "20"
      first_seed:
        description: "First deterministic seed"
        required: true
        default: "2026083001"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi

      - name: Run Python tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi

      - name: Download Forge 2.0.14 source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            --branch forge-2.0.14 \
            https://github.com/Card-Forge/forge.git \
            forge-2.0.14-source

          test -f forge-2.0.14-source/pom.xml

          echo "Forge source:"
          git -C forge-2.0.14-source log -1 --oneline

      - name: Build patched Forge 2.0.14
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh

          ./engine/forge/build_patched_2_0_14.sh \
            "$GITHUB_WORKSPACE/forge-2.0.14-source"

      - name: Locate Forge runtime
        shell: bash
        run: |
          set -euxo pipefail

          find engine/forge -type f -name "*.jar" -print

          JAR="$(find engine/forge -type f -name "*.jar" -print -quit)"

          test -n "$JAR"

          echo "Forge JAR:"
          echo "$JAR"

          sha256sum "$JAR"

      - name: Run Forge regression tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail

          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi

      - name: Run Izzet Spellementals experiment
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail

          mkdir -p results/izzet_spellementals

          python -m engine.runner.experiment \
            --output-dir results/izzet_spellementals \
            --games-per-stage "${{ inputs.games_per_stage }}" \
            --first-seed "${{ inputs.first_seed }}"

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          echo "===== RESULTS ====="

          if [ -d results ]; then
            find results -type f -print | sort

            echo
            echo "===== SUMMARIES ====="

            find results -type f \
              \( -name "summary.json" -o -name "report.md" \) \
              -print \
              -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;
          fi

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izzet-spellementals-results
          path: |
            results/
            engine/forge/dist/
          if-no-files-found: warn
          retention-days: 14
