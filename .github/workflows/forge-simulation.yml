name: Forge simulation

on:
  workflow_dispatch:
    inputs:
      games_per_stage:
        description: "Games per stage (pre-board and post-board)"
        required: true
        default: "20"
      first_seed:
        description: "First deterministic seed"
        required: true
        default: "2026083001"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect repository
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository:"
          pwd
          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200
          echo
          echo "Forge files:"
          find engine/forge -maxdepth 4 -type f 2>/dev/null | sort | head -200 || true

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi

      - name: Run Python tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail

          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory found; continuing."
          fi

      - name: Check Forge build script
        shell: bash
        run: |
          set -euxo pipefail

          test -f engine/forge/build_patched_2_0_14.sh
          chmod +x engine/forge/build_patched_2_0_14.sh

          echo "Build script:"
          sed -n '1,240p' engine/forge/build_patched_2_0_14.sh

      - name: Build patched Forge 2.0.14
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x engine/forge/build_patched_2_0_14.sh
          ./engine/forge/build_patched_2_0_14.sh

      - name: Locate Forge runtime
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for Forge JARs..."
          find engine/forge -type f \( -name "*.jar" -o -name "*.JAR" \) -print

          JAR="$(find engine/forge -type f -name "*.jar" -print -quit)"

          if [ -z "$JAR" ]; then
            echo "ERROR: No Forge JAR was produced."
            exit 1
          fi

          echo "Forge runtime found:"
          echo "$JAR"

          echo "SHA-256:"
          sha256sum "$JAR"

      - name: Run Forge regression tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail

          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi

      - name: Run Izzet Spellementals experiment
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail

          mkdir -p results/izzet_spellementals

          python -m engine.runner.experiment \
            --output-dir results/izzet_spellementals \
            --games-per-stage "${{ inputs.games_per_stage }}" \
            --first-seed "${{ inputs.first_seed }}"

      - name: Display experiment results
        if: always()
        shell: bash
        run: |
          echo "===== RESULT FILES ====="

          if [ -d results ]; then
            find results -type f -maxdepth 5 -print | sort

            echo
            echo "===== SUMMARY FILES ====="

            find results -type f \
              \( -name "summary.json" -o -name "report.md" -o -name "*.jsonl" \) \
              -print \
              -exec sh -c 'echo "--- $1 ---"; head -200 "$1"' _ {} \;
          else
            echo "No results directory was created."
          fi

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izzet-spellementals-results
          path: |
            results/
            engine/forge/dist/
          if-no-files-found: warn
          retention-days: 14
